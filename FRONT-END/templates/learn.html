<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Language Learning Module</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #111111 0%, #222222 100%);
            color: #cccccc;
        }

        .navbar {
            background: linear-gradient(90deg, #45a049, #007399) !important;
        }

        .navbar-brand, .nav-link {
            color: white !important;
        }

        .learning-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            font-size: 3.5em;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #45a049, #007399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: none;
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        .sign-card {
            background-color: #333333;
            border: none;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .sign-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card {
            background-color: #333333;
            border: none;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            color: #45a049;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(90deg, #45a049, #007399);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(69, 160, 73, 0.3);
        }

        .btn-success {
            background: linear-gradient(90deg, #45a049, #007399);
            border: none;
        }

        .progress-section {
            margin-top: 20px;
        }

        .progress {
            background-color: #222222;
            height: 10px;
            border-radius: 5px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #45a049, #007399);
        }

        .btn-group .btn {
            background: #333333;
            border: 1px solid #45a049;
            color: #cccccc;
        }

        .btn-group .btn-check:checked + .btn {
            background: linear-gradient(90deg, #45a049, #007399);
            color: white;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .row {
            animation: slideUp 1s ease-in-out;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Sign Language Recognition</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/learn">Learn</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="learning-container">
        <h1 class="text-center mb-4">Learn Sign Language</h1>
        
        <!-- Language Selection -->
        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <div class="btn-group w-100" role="group">
                    <input type="radio" class="btn-check" name="language" id="asl" value="asl" checked>
                    <label class="btn btn-outline-primary" for="asl">American Sign Language</label>
                    
                    <input type="radio" class="btn-check" name="language" id="isl" value="isl">
                    <label class="btn btn-outline-primary" for="isl">Indian Sign Language</label>
                </div>
            </div>
        </div>

        <!-- Learning Categories -->
        <div class="row mb-4">
            <div class="col-md-6 offset-md-3">
                <div class="card">
                    <div class="card-body text-center">
                        <h5 class="card-title">Alphabet</h5>
                        <p class="card-text">Master the alphabet signs in American and Indian Sign Language through learning and quizzes</p>
                        <button class="btn btn-primary" onclick="loadCategory('alphabet')">Start Learning</button>
                        <button class="btn btn-success mt-2" onclick="startQuiz('alphabet')">Take Quiz</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Learning Content Area -->
        <div id="learning-content" class="mt-4">
            <!-- Content will be loaded dynamically -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/learn.js') }}"></script>
</body>
</html>
